<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>LXC Containers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="index.css">
    <!--
      base1/cockpit.js is an IIFE that assigns window.cockpit and exports
      nothing, so it has to be a classic script rather than a module or an
      import-map target. Cockpit's own pages load it exactly this way.

      It is deliberately not deferred: it must run before the bundle. index.js
      is deferred, so it executes after parsing and after this script, with the
      #app element already in the document.
    -->
    <script type="text/javascript" src="../base1/cockpit.js"></script>
    <!--
      The session's catalogue. Cockpit resolves po.js from the request's
      Accept-Language and serves nothing when no catalogue matches, which is
      fine: English is bundled, so an unmatched locale falls back to it rather
      than to bare keys.

      Only po.js is fetchable. Asking for po.<locale>.js by name returns 404,
      even for Cockpit's own packages, which is why English cannot be a second
      script tag here.
    -->
    <script type="text/javascript" src="po.js"></script>
    <script type="text/javascript" src="index.js" defer></script>
</head>
<body>
    <div id="app"></div>
</body>
</html>
