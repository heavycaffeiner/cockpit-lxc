name: check

# Every push and every pull request. The gates below are the same ones `make
# check` runs locally, so a green tick here means the same thing it means on a
# developer's machine rather than a weaker version of it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # Both ends of the supported range, because one of them alone is a false
    # reassurance.
    #
    # 24 is a Node that upstream still supports, and testing only it would let a
    # change that needs a modern Node through, to be discovered by the deb leg of
    # a release rather than by a pull request.
    #
    # 20 is the floor, and it is not a nostalgic one: Debian 13 trixie ships
    # 20.19, so that is the interpreter the deb is actually built with. Dropping
    # it here would not make the deb build on anything newer, it would only stop
    # anyone from noticing when it broke. It goes when trixie does.
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "24"]

    name: check (node ${{ matrix.node }})

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # Separate steps rather than one `npm run check`, so a failure names the
      # gate that failed in the job summary instead of in a log the reader has
      # to open and scroll.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint JavaScript and TypeScript
        run: npm run lint:js

      - name: Lint stylesheets, including the 4px grid gate
        run: npm run lint:css

      - name: Check the message catalogues
        run: npm run check:po

      - name: Build
        run: npm run build

      # The build is what ships. Keeping it lets a reviewer inspect exactly
      # what a change produced without reproducing the toolchain.
      #
      # From one leg only. Two uploads under one name is an error rather than a
      # merge, and the floor is the leg worth keeping: it is the interpreter the
      # released deb is built with, so this is the output that ships.
      - if: matrix.node == '20'
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-lxc-dist
          path: dist/
          retention-days: 14

  # The runtime layout audit: 4px grid conformance, alignment and separation,
  # measured in a rendered page rather than read out of the stylesheet.
  #
  # Alongside `check` rather than inside it, and with no Node matrix. The audit
  # measures pixels, which the interpreter that produced the bundle cannot
  # change, so a second leg would double the slowest job to re-measure identical
  # numbers.
  #
  # The image is pinned by digest, and build/check-version.mjs fails the `check`
  # job if this reference and test/layout/image.json disagree.
  layout:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e

    steps:
      - uses: actions/checkout@v7

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build the audit harness
        run: npm run build:harness

      - name: Audit the rendered layout
        run: npm run check:layout

      # On failure as well, because the report and the outlined screenshots are
      # the diagnosis. A red job whose evidence was not uploaded costs a second
      # run to reproduce locally.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layout-report
          path: |
            test/layout/layout-report.md
            test/layout/layout-report.json
            test/layout/screenshots/
          retention-days: 14
